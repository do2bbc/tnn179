name: Windows portable CB test package

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 make zip unzip wine wine32:i386 wine64 xvfb
      - name: Build and verify portable package
        run: xvfb-run -a sh tests/package-win32.sh "$RUNNER_TEMP/windows-package"
      - uses: actions/upload-artifact@v4
        with:
          name: TNN-CB-Win32-XP-unverified
          path: ${{ runner.temp }}/windows-package/*
          if-no-files-found: error
  release:
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TNN-CB-Win32-XP-unverified
          path: windows-package
      - name: Attach ZIP and checksum to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" windows-package/* --clobber
